experiment_name: lora-decoder-blocks
max_epochs: 25
batch_size: 4
accumulate_grad_batches: 4

lr: 1.0e-4
llrd: 0.9
weight_decay: 0.05
poly_power: 0.9
warmup_steps: [200, 200]

# ── Attention mask annealing ──────────────────────────────────────────────────
# Proportions mirror the original EoMT Cityscapes config (20/40/50/70/80/100%).
# Computed for 25 epochs × 186 optimizer steps/epoch = 4650 total steps.
attn_mask_annealing_enabled: false  # disabled: masked_attn_enabled=False in build_lora_model
attn_mask_annealing_start_steps: [930, 2325, 3720]
attn_mask_annealing_end_steps:   [1860, 3255, 4650]

# ── Model capacity ───────────────────────────────────────────────────────────
# 200 queries matches the COCO checkpoint shape — changing this causes a RuntimeError in load_state_dict (shape mismatch on network.q.weight even with strict=False).
num_q: 200

# ── LoRA adapter architecture ─────────────────────────────────────────────────
# Adapters injected into the full backbone; trainable_blocks=range(9,12) keeps
# only the last 3 encoder blocks' adapters trainable, alongside the decoder heads.
# 'proj' is the attention output projection — adds capacity at minimal parameter cost.
lora_r: 8
lora_alpha: 16
lora_target_modules: ['qkv', 'proj', 'fc1', 'fc2']
lora_dropout: 0.05
gradient_clip_val: 1.0

# ── Data augmentation ─────────────────────────────────────────────────────────
gaussian_blur_enabled: true
