# ==============================================================================
# Optimal LoRA Configuration for EoMT Cityscapes Fine-Tuning
# ==============================================================================
experiment_name: "exp_optimal_full_lora"

# ------------------------------------------------------------------------------
# 1. Hardware & Batching
# ------------------------------------------------------------------------------
max_epochs: 10
batch_size: 4                  # Fits comfortably on Colab A100/T4 (640x640 images)
accumulate_grad_batches: 4     # 4 * 4 = 16 Effective Batch Size (matches paper)

# ------------------------------------------------------------------------------
# 2. Optimization Strategy
# ------------------------------------------------------------------------------
# Base Learning Rate for the fresh heads and top-layer (Block 11) adapters.
lr: 1.0e-4

# Layer-wise Learning Rate Decay. 0.9 gives a gentle ~3x spread from Block 11
# down to Block 0, protecting pre-trained features.
llrd: 0.9

# AdamW weight decay. (Correctly excludes 1D biases/norms from this).
weight_decay: 0.05

# Gradient Clipping. Loosened to 0.05 to allow the LoRA adapters to learn,
# while still providing a safety net against exploding gradients.
gradient_clip_val: 0.05

# ------------------------------------------------------------------------------
# 3. Two-Stage Warmup ("Shock Protection")
# ------------------------------------------------------------------------------
# Total optimizer steps = (2975 images / 16 effective batch size) * 10 epochs = 1860
# [125, 125] corresponds to ~13.4% of total steps, which is perfectly balanced.
# - Stage 1 (125 steps): Head warms up, Backbone is strictly frozen.
# - Stage 2 (125 steps): Head decays, Backbone ramps up linearly.
warmup_steps: [125, 125]
poly_power: 0.9                # Standard polynomial decay curve exponent

# ------------------------------------------------------------------------------
# 4. Attention Mask Annealing
# ------------------------------------------------------------------------------
# Mirrors the EoMT Cityscapes training schedule at proportions 20/40/50/70/80/100%
# of total steps. Computed for 10 epochs × 186 optimizer steps/epoch = 1860 total.
attn_mask_annealing_enabled: true
attn_mask_annealing_start_steps: [372, 930, 1488]
attn_mask_annealing_end_steps:   [744, 1302, 1860]

# ------------------------------------------------------------------------------
# 5. Model Capacity
# ------------------------------------------------------------------------------
# 200 queries matches the COCO checkpoint shape — changing this causes a RuntimeError in load_state_dict (shape mismatch on network.q.weight even with strict=False).
num_q: 200

# ------------------------------------------------------------------------------
# 6. LoRA Adapter Architecture
# ------------------------------------------------------------------------------
# Rank 16 gives the model more capacity for the COCO → Cityscapes domain shift.
lora_r: 16

# Alpha = 2 * r is the theoretical sweet spot for signal-to-noise ratio.
lora_alpha: 32

# Mild regularization to prevent overfitting on the small (~3k) dataset.
lora_dropout: 0.05

# qkv: query/key/value projections. proj: attention output projection.
# fc1/fc2: MLP layers. Together these cover all representational capacity in ViT.
lora_target_modules:
  - "qkv"
  - "proj"
  - "fc1"
  - "fc2"

# ------------------------------------------------------------------------------
# 7. Data Augmentation
# ------------------------------------------------------------------------------
# Gaussian blur (p=0.5) addresses the sharpness distribution shift COCO → Cityscapes.
gaussian_blur_enabled: true
